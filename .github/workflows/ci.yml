# Backstop for the local checks: runs the same hooks as `nix develop`
# (`nix flake check`, then the pre-push hooks).
# On main, also tags vX.Y.Z and publishes a GitHub Release from CHANGELOG.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags for the pre-push hooks
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: pre-commit hooks
        run: nix flake check
      - name: pre-push hooks
        run: nix develop -c pre-commit run --all-files --hook-stage pre-push
      - name: version above target branch
        if: github.event_name == 'pull_request'
        run: scripts/check-release.sh --base "origin/$GITHUB_BASE_REF"

  release:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA" ]; then
              echo "$tag already released from this commit"
              exit 0
            fi
            echo "::error::$tag already exists on another commit: VERSION was not bumped"
            exit 1
          fi
          scripts/check-release.sh --notes > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
